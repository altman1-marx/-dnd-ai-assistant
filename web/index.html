<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DND AI Assistant</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f1e8;
      --surface: #fffaf0;
      --surface-2: #f0f7f4;
      --ink: #221f1a;
      --muted: #6e675c;
      --line: #d6cfc0;
      --accent: #1f6f78;
      --accent-2: #8f3f35;
      --focus: #2f6fed;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      min-height: 38px;
      padding: 0 12px;
      cursor: pointer;
    }

    button.secondary {
      background: var(--surface);
      color: var(--accent);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 9px 10px;
    }

    textarea {
      min-height: 88px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    button:focus {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(250px, 320px) minmax(0, 1fr) minmax(260px, 360px);
      min-height: 100vh;
    }

    .sidebar,
    .panel {
      border-right: 1px solid var(--line);
      background: var(--surface);
      padding: 18px;
      overflow: auto;
    }

    .panel {
      border-right: 0;
      border-left: 1px solid var(--line);
      background: var(--surface-2);
    }

    main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 18px;
      gap: 14px;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: 22px;
      line-height: 1.2;
    }

    h2 {
      font-size: 15px;
      margin-bottom: 8px;
    }

    h3 {
      font-size: 14px;
      margin-bottom: 6px;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .stack {
      display: grid;
      gap: 12px;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .row > * {
      flex: 1;
    }

    .compact-row {
      flex: 0 0 auto;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
    }

    .status {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      padding: 10px;
      color: var(--muted);
      min-height: 40px;
      white-space: pre-wrap;
    }

    .packet-view {
      display: grid;
      gap: 12px;
      color: var(--text);
      white-space: normal;
    }

    .packet-section {
      display: grid;
      gap: 6px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }

    .packet-section:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .packet-section h3 {
      margin: 0;
      font-size: 13px;
      color: var(--accent);
    }

    .packet-section ul {
      margin: 0;
      padding-left: 18px;
    }

    .packet-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .briefing-view {
      display: grid;
      gap: 10px;
      color: var(--ink);
      white-space: normal;
    }

    .briefing-kv {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 8px;
      font-size: 13px;
      line-height: 1.35;
    }

    .briefing-kv span {
      color: var(--muted);
    }

    .briefing-list {
      margin: 0;
      padding-left: 18px;
      display: grid;
      gap: 4px;
    }

    .briefing-note {
      border-left: 3px solid var(--accent);
      padding-left: 9px;
      line-height: 1.4;
    }

    .transcript {
      flex: 1;
      min-height: 320px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      padding: 14px;
      overflow: auto;
      line-height: 1.45;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      padding: 10px;
      white-space: pre-wrap;
    }

    .message strong {
      display: block;
      color: var(--accent);
      font-size: 12px;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .message-meta {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 6px;
    }

    .message.system strong {
      color: var(--muted);
    }

    .message.ai-dm strong {
      color: var(--accent-2);
    }

    .quick-actions {
      display: grid;
      gap: 10px;
    }

    .recommended-actions {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    .recommended-actions h3 {
      color: var(--accent);
    }

    .recommendation-list {
      display: grid;
      gap: 8px;
    }

    .recommendation {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      border-top: 1px solid var(--line);
      padding-top: 8px;
    }

    .recommendation:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .recommendation strong {
      display: block;
      font-size: 13px;
    }

    .quick-action-group {
      display: grid;
      gap: 6px;
    }

    .quick-action-group-title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .quick-action-buttons {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .metric {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      padding: 8px 0;
      font-size: 14px;
    }

    .list {
      display: grid;
      gap: 8px;
    }

    .rules-results {
      display: grid;
      gap: 8px;
    }

    .campaign-list {
      display: grid;
      gap: 8px;
    }

    .campaign-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 6px;
      align-items: center;
    }

    .campaign-row button {
      min-height: 32px;
      padding: 0 9px;
    }

    .item {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      padding: 10px;
    }

    .item strong {
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .item .score {
      color: var(--muted);
      font-size: 12px;
    }

    .danger {
      color: var(--accent-2);
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar,
      .panel {
        border: 0;
        border-bottom: 1px solid var(--line);
      }

      .quick-actions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar stack">
      <header class="stack">
        <h1>DND AI Assistant</h1>
        <p class="muted" data-i18n="appSubtitle">Local campaign console for the lightweight API.</p>
        <label>
          <span class="muted" data-i18n="languageLabel">Language</span>
          <select id="languageSelect">
            <option value="en">English</option>
            <option value="zh">中文</option>
          </select>
        </label>
      </header>

      <section class="stack" aria-labelledby="api-title">
        <h2 id="api-title">API</h2>
        <label>
          <span class="muted" data-i18n="baseUrl">Base URL</span>
          <input id="apiBase" value="http://127.0.0.1:8000" autocomplete="off">
        </label>
        <button id="healthButton" type="button" class="secondary" data-i18n="checkApi">Check API</button>
      </section>

      <section class="stack" aria-labelledby="help-title">
        <h2 id="help-title" data-i18n="helpTitle">Help</h2>
        <div id="helpText" class="status"></div>
      </section>

      <section class="stack" aria-labelledby="import-title">
        <h2 id="import-title" data-i18n="adventureTitle">Adventure</h2>
        <input id="adventureFile" type="file" accept="application/json,.json">
        <button id="importButton" type="button" data-i18n="importAdventure">Import Adventure</button>
        <button id="demoButton" type="button" class="secondary" data-i18n="startDemo">Start Demo</button>
        <button id="sampleButton" type="button" class="secondary" disabled data-i18n="addSampleCharacter">Add Sample Character</button>
      </section>

      <section class="stack" aria-labelledby="coc-title">
        <h2 id="coc-title">Call of Cthulhu</h2>
        <input id="cocFile" type="file" accept="application/json,.json">
        <button id="cocImportButton" type="button" data-i18n="importCoc">Import COC Scenario</button>
        <textarea id="cocPremise" placeholder="COC premise, e.g. A lake reflects the wrong moon." data-i18n-placeholder="cocPremisePlaceholder"></textarea>
        <button id="cocGenerateButton" type="button" class="secondary" data-i18n="generateCoc">Generate COC Scenario</button>
        <label><span data-i18n="demoScenario">Demo Scenario</span>
          <select id="cocDemoScenario">
            <option value="briar_house">Briar House</option>
            <option value="glass_lake">Glass Lake Signal</option>
          </select>
        </label>
        <button id="cocDemoButton" type="button" class="secondary" data-i18n="startCocDemo">Start COC Demo</button>
        <div id="cocList" class="campaign-list"></div>
      </section>

      <section class="stack" aria-labelledby="campaign-title">
        <h2 id="campaign-title" data-i18n="campaignTitle">Campaign</h2>
        <div id="status" class="status">No campaign loaded.</div>
        <button id="campaignsButton" type="button" class="secondary" data-i18n="refreshCampaigns">Refresh Campaigns</button>
        <div id="campaignList" class="campaign-list"></div>
      </section>
    </aside>

    <main>
      <div class="toolbar">
        <div>
          <h2 data-i18n="tableTitle">Table</h2>
          <p id="locationLine" class="muted" data-i18n="importToBegin">Import an adventure to begin.</p>
        </div>
        <div class="row compact-row">
          <select id="logVisibility" disabled aria-label="Log visibility">
            <option value="" data-i18n="allLogs">All Logs</option>
            <option value="public" data-i18n="publicLogs">Public</option>
            <option value="dm_only" data-i18n="dmOnlyLogs">DM Only</option>
          </select>
          <button id="refreshButton" type="button" class="secondary" disabled data-i18n="refresh">Refresh</button>
          <button id="clearTranscriptButton" type="button" class="secondary" disabled data-i18n="clearLogView">Clear Log View</button>
        </div>
      </div>

      <section id="transcript" class="transcript" aria-live="polite"></section>

      <section id="recommendedActions" class="recommended-actions" aria-live="polite"></section>

      <section class="stack" aria-label="Action input">
        <div class="quick-actions">
          <button type="button" class="secondary" data-action="look" data-i18n="lookAction">Look</button>
          <button type="button" class="secondary" data-action="inspect" data-i18n="inspectAction">Inspect</button>
        </div>
        <div class="row">
          <input id="actionInput" placeholder="Type an action, e.g. go old road" autocomplete="off" disabled data-i18n-placeholder="actionPlaceholder">
          <button id="sendButton" type="button" disabled data-i18n="send">Send</button>
          <button id="dmButton" type="button" class="secondary" disabled data-i18n="dmSuggest">DM Suggest</button>
          <button id="runSuggestedButton" type="button" class="secondary" disabled data-i18n="runSuggested">Run Suggested</button>
        </div>
      </section>
    </main>

    <aside class="panel stack">
      <section>
        <h2 data-i18n="summaryTitle">Summary</h2>
        <div id="metrics"></div>
      </section>

      <section>
        <h2 data-i18n="charactersTitle">Characters</h2>
        <div id="characters" class="list"></div>
      </section>

      <section>
        <h2 id="activityTitle">Combat</h2>
        <div id="combat" class="list"></div>
      </section>

      <section class="stack" aria-labelledby="player-card-title">
        <h2 id="player-card-title" data-i18n="playerCardTitle">Player Card</h2>
        <button id="playerCardButton" type="button" class="secondary" disabled data-i18n="loadPlayerCard">Load Player Card</button>
        <div id="playerCard" class="status">No player card loaded.</div>
      </section>

      <section class="stack" aria-labelledby="briefing-title">
        <h2 id="briefing-title" data-i18n="keeperBriefingTitle">Keeper Briefing</h2>
        <button id="briefingButton" type="button" class="secondary" disabled data-i18n="loadKeeperBriefing">Load Keeper Briefing</button>
        <button id="tablePacketButton" type="button" class="secondary" disabled data-i18n="tablePacket">Table Packet</button>
        <div id="keeperBriefing" class="status">No briefing loaded.</div>
      </section>

      <section class="stack" aria-labelledby="rules-title">
        <h2 id="rules-title" data-i18n="rulesTitle">Rules</h2>
        <input id="rulesQuery" placeholder="Search rules, e.g. grapple attack action" autocomplete="off" data-i18n-placeholder="rulesPlaceholder">
        <button id="rulesButton" type="button" class="secondary" data-i18n="searchRules">Search Rules</button>
        <div id="rulesResults" class="rules-results"></div>
      </section>
    </aside>
  </div>

    });
    bindQuickActions();

    setControls(false);
    setLanguage(loadPreferredLanguage());

    function loadPreferredLanguage() {
      try {
        const saved = localStorage.getItem("dnd-ai-language");
        return saved === "zh" ? "zh" : "en";
      } catch (error) {
        return "en";
      }
    }

    function setLanguage(locale) {
      state.locale = locale === "zh" ? "zh" : "en";
      languageSelect.value = state.locale;
      document.documentElement.lang = state.locale === "zh" ? "zh-CN" : "en";
      try {
        localStorage.setItem("dnd-ai-language", state.locale);
      } catch (error) {
        // Ignore storage failures in file:// or private browsing contexts.
      }
      translateStaticText();
      helpText.textContent = t("helpText");
      translateEmptyDynamicPanels();
      renderCampaignList();
      if (state.mode === "coc" && state.cocSummary) {
        renderCocSummary();
      } else if (state.summary) {
        renderSummary();
      } else {
        activityTitle.textContent = t("combatTitle");
        renderRecommendedActions([]);
      }
    }

    function translateStaticText() {
      document.querySelectorAll("[data-i18n]").forEach((element) => {
        element.textContent = t(element.dataset.i18n);
      });
      document.querySelectorAll("[data-i18n-placeholder]").forEach((element) => {
        element.setAttribute("placeholder", t(element.dataset.i18nPlaceholder));
      });
    }

    function t(key) {
      const dictionary = translations[state.locale] || translations.en;
      return dictionary[key] || translations.en[key] || key;
    }

    function label(key, fallback) {
      const value = t(key);
      return value === key ? fallback : value;
    }

    function translateEmptyDynamicPanels() {
      if (!state.campaignId && !state.scenarioId) statusBox.textContent = t("noCampaignLoaded");
      if (!state.cocPlayerCard) playerCard.textContent = t("noPlayerCard");
      if (!state.cocBriefing && !state.cocTablePacket) keeperBriefing.textContent = t("noBriefing");
    }

    async function checkHealth() {
      try {
        const data = await api("GET", "/health");
        if (data.ok) {
          const features = data.features || {};
          setStatus([
            t("apiReady"),
            t("campaignsCount") + ": " + String(data.campaign_count || 0),
            t("cocCount") + ": " + String(data.coc_scenario_count || 0),
            t("rulesFeature") + ": " + featureLabel(features.rules_search),
            t("aiDmFeature") + ": " + featureLabel(features.ai_dm),
            t("persistenceFeature") + ": " + featureLabel(features.persistent_state)
          ].join("\n"));
        } else {
          setStatus(t("apiUnexpected"));
        }
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    async function importAdventure() {
      const file = adventureFile.files[0];
      if (!file) {
        setStatus(t("chooseAdventureFile"), true);
        return;
      }
      try {
        const adventure = JSON.parse(await file.text());
        const data = await api("POST", "/campaigns/import", { adventure });
        state.mode = "dnd";
        state.campaignId = data.campaign_id;
        state.scenarioId = "";
        state.cocBriefing = null;
        state.cocTablePacket = null;
        state.cocPlayerCard = null;
        renderKeeperBriefing(null);
        renderPlayerCard(null);
        appendTranscriptMessage("System", t("importedPrefix") + " " + data.campaign.title + ".");
        setControls(true);
        await refreshCampaigns();
        await refreshCampaignView();
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    async function loadDemoAdventure() {
      try {
        const data = await api("POST", "/campaigns/demo-with-character", {});
        state.mode = "dnd";
        state.campaignId = data.campaign_id;
        state.scenarioId = "";
        state.cocBriefing = null;
        state.cocTablePacket = null;
        state.cocPlayerCard = null;
        renderKeeperBriefing(null);
        renderPlayerCard(null);
        appendTranscriptMessage("System", t("startedDemoPrefix") + " " + data.campaign.title + " " + t("withLethSuffix"));
        setControls(true);
        await refreshCampaigns();
        await refreshCampaignView();
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    async function loadCocDemoOptions() {
      try {
        const data = await api("GET", "/coc/demo-options");
        state.cocDemoOptions = data.options || [];
        renderCocDemoOptions();
      } catch (error) {
        state.cocDemoOptions = [];
      }
    }

    function renderCocDemoOptions() {
      if (!state.cocDemoOptions.length) return;
      const current = cocDemoScenario.value;
      cocDemoScenario.innerHTML = state.cocDemoOptions.map((option) => {
        const detail = option.location + " | " + option.investigator + ", " + option.occupation;
        return "<option value=\"" + escapeHtml(option.id) + "\" title=\"" + escapeHtml(detail) + "\">"
          + escapeHtml(option.title) + "</option>";
      }).join("");
      if (state.cocDemoOptions.some((option) => option.id === current)) {
        cocDemoScenario.value = current;
      }
    }

    async function loadCocDemo() {
      try {
        const data = await api("POST", "/coc/demo", { scenario: cocDemoScenario.value });
        if (state.scenarioId !== data.scenario_id || state.mode !== "coc") clearTranscriptView();
        state.mode = "coc";
        state.scenarioId = data.scenario_id;
        state.campaignId = "";
        appendTranscriptMessage("System", t("startedCocPrefix") + " " + data.scenario.title + ".");
        setControls(true);
        await refreshCampaigns();
        await refreshCocView();
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    async function importCocScenario() {
      const file = cocFile.files[0];
      if (!file) {
        setStatus(t("chooseCocFile"), true);
        return;
      }
      try {
        const scenario = JSON.parse(await file.text());
        const data = await api("POST", "/coc/import", { scenario });
        clearTranscriptView();
        state.mode = "coc";
        state.scenarioId = data.scenario_id;
        state.campaignId = "";
        appendTranscriptMessage("System", t("importedCocPrefix") + " " + data.scenario.title + ".");
        setControls(true);
        await refreshCampaigns();
        await refreshCocView();
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    async function generateCocScenario() {
      const premise = cocPremise.value.trim();
      if (!premise) {
        setStatus(t("enterCocPremise"), true);
        return;
      }
      try {
        const data = await api("POST", "/coc/generate", {
          premise,
          max_attempts: 2,
          require_review_ok: true
        });
        clearTranscriptView();
        state.mode = "coc";
        state.scenarioId = data.scenario_id;
        state.campaignId = "";
        state.cocReview = data.review || null;
        appendTranscriptMessage("System", t("generatedCocPrefix") + " " + data.scenario.title + ".");
        setControls(true);
        await refreshCampaigns();
        await refreshCocView();
      } catch (error) {
        appendTranscriptMessage("System", setupHint(error));
        setStatus(error.message, true);
      }
    }

    async function addSampleCharacter() {
      if (!state.campaignId) return;
      try {
        const data = await api("POST", "/campaigns/" + state.campaignId + "/sample-character", {});
        appendTranscriptMessage("System", t("addedPrefix") + " " + data.character.name + ".");
        await refreshCampaignView();
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    async function refreshCampaignView() {
      if (state.mode === "coc") {
        await refreshCocView();
        return;
      }
      if (!state.campaignId) return;
      await refreshCampaignLog();
      await refreshSummary();
    }

    async function refreshCocView() {
      if (!state.scenarioId) return;
      try {
        state.cocSummary = await api("GET", "/coc/" + state.scenarioId + "/summary");
        state.cocReview = await api("GET", "/coc/" + state.scenarioId + "/review");
        state.cocBriefing = await api("GET", "/coc/" + state.scenarioId + "/briefing");
        state.cocPlayerCard = await api("GET", "/coc/" + state.scenarioId + "/player-card");
        renderCocSummary();
        renderKeeperBriefing(state.cocBriefing);
        renderPlayerCard(state.cocPlayerCard);
        renderCocRecentEvents(state.cocSummary.recent_events || []);
        setStatus(composeCocStatus());
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    async function loadKeeperBriefing() {
      if (!state.scenarioId) return;
      try {
        state.cocBriefing = await api("GET", "/coc/" + state.scenarioId + "/briefing");
        renderKeeperBriefing(state.cocBriefing);
        setStatus(t("keeperBriefingLoaded"));
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    async function loadTablePacket() {
      if (!state.scenarioId) return;

    async function sendTypedAction() {
      const action = actionInput.value.trim();
      if (!action) return;
      actionInput.value = "";
      await runAction(action);
    }

    async function suggestTypedAction() {
      const action = actionInput.value.trim() || state.lastRulesQuery;
      if (!action || (!state.campaignId && !state.scenarioId)) return;
      if (state.mode === "coc") {
        await suggestCocAction(action);
        return;
      }
      try {
        const data = await api("POST", "/campaigns/" + state.campaignId + "/dm-suggestion", { action });
        state.pendingSuggestedAction = action;
        actionInput.value = action;
        updateSuggestedActionControl();
        appendTranscriptMessage("AI DM", data.suggestion.text);
        if (data.suggestion.rules && data.suggestion.rules.length) {
          renderRulesResults(data.suggestion.rules);
          appendTranscriptMessage("Rules", ruleSourceSummary(data.suggestion.rules));
        }
        setStatus(t("aiDmReady") + " " + dmSuggestionMetadata(data.metadata));
      } catch (error) {
        appendTranscriptMessage("System", setupHint(error));
        setStatus(error.message, true);
      }
    }

    async function suggestCocAction(action) {
      try {
        const data = await api("POST", "/coc/" + state.scenarioId + "/keeper-suggestion", { action });
        state.pendingSuggestedAction = action;
        actionInput.value = action;
        updateSuggestedActionControl();
        appendTranscriptMessage("AI Keeper", data.suggestion.text);
        setStatus(t("aiKeeperReady") + " " + t("actionPrefix") + ": " + action + ".");
      } catch (error) {
        appendTranscriptMessage("System", setupHint(error));
        setStatus(error.message, true);
      }
    }

    async function runSuggestedAction() {
      if (!state.pendingSuggestedAction) return;
      const action = state.pendingSuggestedAction;
      state.pendingSuggestedAction = "";
      updateSuggestedActionControl();
      await runAction(action);
    }

    async function runAction(action) {
      if (action.includes("<text>")) {
        actionInput.value = action.replace("<text>", "").trim() + " ";
        actionInput.focus();
        setStatus(t("completeActionText"));
        return;
      }
      if (state.mode === "coc") {
        await runCocAction(action);
        return;
      }
      if (!state.campaignId) return;
      if (state.pendingSuggestedAction === action) {
        state.pendingSuggestedAction = "";
        updateSuggestedActionControl();
      }
      try {
        const data = await api("POST", "/campaigns/" + state.campaignId + "/actions", {
          action,
          seed: 5
        });
        appendTranscript(data.transcript);
        (data.messages || []).forEach((message) => state.transcriptEventIds.add(message.id));
        await refreshSummary();
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    async function runCocAction(action) {
      if (!state.scenarioId) return;
      try {
        const data = await api("POST", "/coc/" + state.scenarioId + "/actions", {
          action,
          seed: 5
        });
        appendTranscript(data.transcript);
        state.cocSummary = data.summary;
        renderCocSummary();
        renderCocRecentEvents(state.cocSummary.recent_events || []);
        setStatus(composeCocStatus());
        await refreshCampaigns();
      } catch (error) {
        setStatus(error.message, true);
      }
    }

        return;
      }

        renderRulesResults(data.results || []);

        rulesResults.innerHTML = "<p class=\"muted\">" + escapeHtml(setupHint(error)) + "</p>";
        setStatus(error.message, true);

    async function api(method, path, body) {
      const options = {
        method,
        headers: { "Content-Type": "application/json" }
      };
      if (body !== undefined) options.body = JSON.stringify(body);
      const response = await fetch(apiBase.value.replace(/\/$/, "") + path, options);
      const data = await response.json();
      if (!response.ok) throw apiErrorFromResponse(data);
      return data;
    }

    function apiErrorFromResponse(data) {
      const error = data.error || {};
      const message = error.message || data.error_message || "Request failed.";
      const wrapped = new Error(message);
      wrapped.code = error.code || "request_failed";
      return wrapped;
    }

    function setupHint(error) {
      if (error.code === "ai_provider_not_configured") {
        return t("aiProviderHint");
      }
      if (error.code === "rules_corpus_not_configured") {
        return t("rulesCorpusHint");
      }
      if (error.code === "ai_provider_error") {
        return t("aiProviderErrorHint");
      }
      return error.message;
    }

    function completionProgressLabel(progress) {
      const groups = Object.values(progress);
      if (!groups.length) return t("legacyClueEnding");
      const required = groups.reduce((total, group) => total + ((group.required || []).length), 0);
      const remaining = groups.reduce((total, group) => total + ((group.remaining || []).length), 0);
      if (!required) return t("noExplicitGates");
      return String(required - remaining) + "/" + String(required) + " " + t("metSuffix");
    }

    function renderCocInvestigationPanel(summary, review) {
      const sections = [

        sections.push(renderCocReviewFindings(review.findings));

      const conditions = investigator.conditions || [];
      const sanity = String(investigator.current_sanity ?? "?") + "/" + String(investigator.max_sanity ?? "?");

        return "<p>" + escapeHtml(cocProgressLabel(key)) + ": "

        metric(t("bonusMetric"), resourceLabel(resources.bonus_action)),
        metric(t("reactionMetric"), resourceLabel(resources.reaction)),
        metric(t("movementMetric"), String(resources.movement ?? 0) + " ft"),
        metric(t("monsterAiMetric"), activeCombat.monster_action_strategy || "default_attack"),
        metric(t("lastAutoMetric"), activeCombat.last_automatic_action || t("none")),
        metric(t("moraleMetric"), activeCombat.morale_hint || "steady"),
        metric(t("targetsMetric"), (activeCombat.targetable_enemies || []).join(", ") || t("none"))
      ];
      const initiative = activeCombat.initiative || [];
      lines.push(initiative.map((entry) => {
        const deathSaves = entry.death_saves || { successes: 0, failures: 0 };
        const conditions = (entry.conditions || []).join(", ") || t("none");
        return "<div class=\"item\"><strong>" + escapeHtml(entry.name || t("unknown")) + "</strong><p class=\"muted\">Initiative "
          + escapeHtml(String(entry.initiative_total)) + " | AC " + escapeHtml(String(entry.armor_class || "?"))
          + " | HP " + escapeHtml(String(entry.current_hp || "?"))
          + " | " + escapeHtml(entry.defeated ? t("defeated") : t("activeSuffix")) + "</p><p class=\"muted\">" + escapeHtml(t("conditionsLabel")) + " "
          + escapeHtml(conditions) + " | " + escapeHtml(t("deathSavesLabel")) + " " + escapeHtml(String(deathSaves.successes || 0))
          + "S / " + escapeHtml(String(deathSaves.failures || 0)) + "F</p></div>";
      }).join(""));
      const targetActions = combatTargetActions(activeCombat, availableActions || []);
      if (targetActions.length) {
        lines.push("<div class=\"item\"><strong>" + escapeHtml(t("targetActionsTitle")) + "</strong><p>" + targetActions.map((action) => {
          return "<button type=\"button\" class=\"secondary\" data-action=\"" + escapeHtml(action) + "\">"
            + escapeHtml(actionLabel(action)) + "</button>";
        }).join(" ") + "</p></div>");
      }
      return lines.join("");
    }

    function combatTargetActions(activeCombat, availableActions) {
      const targets = (activeCombat.targetable_enemies || []).concat(activeCombat.targetable_allies || []);
      return availableActions.filter((action) => {
        const normalized = action.toLowerCase();
        return targets.some((target) => normalized.endsWith(" " + String(target).toLowerCase()));
      });
    }

    function resourceLabel(value) {
      return value ? t("available") : t("spent");
    }

    function renderRulesResults(results) {
      if (!results.length) {
        rulesResults.innerHTML = "<p class=\"muted\">" + escapeHtml(t("noMatchingRules")) + "</p>";
        return;
      }
      rulesResults.innerHTML = results.map((result) => {
        const excerpt = result.text.length > 360 ? result.text.slice(0, 357).trim() + "..." : result.text;
        return "<div class=\"item\"><strong>" + escapeHtml(result.section)
          + "</strong><p class=\"score\">" + escapeHtml(t("scoreLabel")) + " " + escapeHtml(String(result.score))
          + " | " + escapeHtml(result.title) + "</p><p>"
          + escapeHtml(excerpt) + "</p><p class=\"muted\">"
          + escapeHtml(result.url) + "</p><button type=\"button\" class=\"secondary\" data-use-rule=\""
          + escapeHtml(result.section) + "\">" + escapeHtml(t("useButton")) + "</button></div>";
      }).join("");
      document.querySelectorAll("[data-use-rule]").forEach((button) => {
        button.addEventListener("click", () => useRuleResult(button.dataset.useRule));
      });
    }

    function useRuleResult(section) {
      const action = state.lastRulesQuery || section || "";
      actionInput.value = action;
      actionInput.focus();
      setStatus(t("loadedRuleQuery"));
    }

    function ruleSourceSummary(rules) {
      return t("referencedPrefix") + ": " + rules.map((rule) => rule.section).join(", ");
    }

    function dmSuggestionMetadata(metadata) {
      if (!metadata) return "";
      const action = metadata.action ? t("actionPrefix") + ": " + metadata.action + ". " : "";
      const rules = metadata.used_rules ? t("rulesReferenced") + ": " + String(metadata.rules_count) + "." : t("noRulesReferenced");
      return action + rules;
    }

    function renderPlayerCard(card) {
      if (!card) {
        playerCard.textContent = state.mode === "coc" ? t("playerCardUnavailable") : t("cocModeOnly");
        return;
      }
      const investigator = card.investigator || {};
      const skills = investigator.skills || {};
      const skillText = Object.entries(skills).map(([name, value]) => name + " " + value).join(", ") || t("none");
      const clues = (card.discovered_clues || []).map((clue) => clue.title).join(", ") || t("none");
      playerCard.textContent = (investigator.name || t("investigatorFallback"))
        + " | HP " + String((investigator.hp || {}).current ?? "?") + "/" + String((investigator.hp || {}).max ?? "?")
        + " | SAN " + String((investigator.sanity || {}).current ?? "?") + "/" + String((investigator.sanity || {}).max ?? "?")
        + " | Luck " + String(investigator.luck ?? "?")
        + "\n" + t("skillsLabel") + ": " + skillText
        + "\n" + t("evidenceMetric") + ": " + ((card.inventory || []).join(", ") || t("none"))
        + "\n" + t("discoveredCluesLabel") + ": " + clues;
    }

    function renderTablePacket(packet) {
      if (!packet) {
        keeperBriefing.textContent = t("noTablePacket");
        return;
      }
      const profile = packet.scenario_profile || {};
      const checklist = packet.keeper_checklist || {};
      const handout = packet.player_handout || {};
      const opening = packet.keeper_opening || {};
      const actions = checklist.first_turn_actions || [];
      const clueMap = packet.clue_map || [];
      const npcCards = packet.npc_cards || [];
      const profileRows = [
        [t("scenarioMetric"), packet.title || t("cocTablePacketTitle")],
        [t("systemMetric"), packet.system_id || "coc7e"],
        [t("startingLocationLabel"), profile.starting_location || handout.starting_location || t("unknown")],
        [t("locationsLabel"), String(profile.location_count || 0)],
        [t("cluesMetric"), String(profile.clue_count || 0)],
        [t("npcsMetric"), String(profile.npc_count || 0)],
        [t("estimatedLabel"), String(profile.estimated_minutes || 0) + " " + t("minutesLabel")],
        [t("hiddenClueCountLabel"), String(checklist.hidden_clue_count || 0)],
        [t("completionGateCountLabel"), String(profile.completion_gate_count || 0)]
      ];
      const clueHtml = clueMap.length ? clueMap.map((location) => {
        const clues = (location.clues || []).map((clue) => {
          const tags = [
            clue.required ? t("requiredTag") : "",
            clue.skill ? clue.skill + " " + clue.difficulty : t("automaticTag"),
            clue.sanity_loss ? "SAN " + clue.sanity_loss : ""
          ].filter(Boolean).join(", ");
          return "<li><strong>" + escapeHtml(clue.title) + "</strong> - "
            + escapeHtml(clue.action || "inspect")
            + (tags ? " <span class=\"muted\">(" + escapeHtml(tags) + ")</span>" : "")
            + "</li>";
        }).join("") || "<li>" + escapeHtml(t("none")) + "</li>";
        return "<li><strong>" + escapeHtml(location.location) + "</strong><ul>" + clues + "</ul></li>";
      }).join("") : "<li>" + escapeHtml(t("none")) + "</li>";
      const npcHtml = npcCards.length ? npcCards.map((npc) => {

      }).join("") : "<li>" + escapeHtml(t("none")) + "</li>";
      keeperBriefing.innerHTML = "<div class=\"packet-view\">"
        + renderKeeperActionButtons(actions, t("recommendedNextTitle"))
        + "<section class=\"packet-section\"><h3>" + escapeHtml(t("packetProfileTitle")) + "</h3>"
        + renderBriefingKeyValues(profileRows) + "</section>"
        + "<section class=\"packet-section\"><h3>" + escapeHtml(t("keeperOpeningTitle")) + "</h3><p>"
        + escapeHtml(opening.read_aloud || "") + "</p><p class=\"muted\">"
        + escapeHtml(opening.safety_note || "") + "</p></section>"
        + "<section class=\"packet-section\"><h3>" + escapeHtml(t("playerHandoutTitle")) + "</h3><p>"
        + escapeHtml((handout.investigator || t("investigatorFallback")) + " - " + (handout.occupation || ""))
        + "</p><p>" + escapeHtml(handout.case_hook || "")
        + "</p>" + renderPacketHandoutMeta(handout) + "</section>"
        + "<section class=\"packet-section\"><h3>" + escapeHtml(t("sceneBeatsTitle")) + "</h3><ul>"
        + (checklist.scene_beats || []).map((beat) => "<li>" + escapeHtml(beat) + "</li>").join("")
        + "</ul></section>"
        + renderBriefingListSection(t("openThreadsTitle"), checklist.open_threads || [])
        + "<section class=\"packet-section\"><h3>" + escapeHtml(t("clueMapTitle")) + "</h3><ul>" + clueHtml + "</ul></section>"
        + "<section class=\"packet-section\"><h3>" + escapeHtml(t("npcCardsTitle")) + "</h3><ul>" + npcHtml + "</ul></section>"
        + "</div>";
      bindKeeperActionButtons();

    function renderPacketHandoutMeta(handout) {
      const knownPeople = handout.known_people || [];
      const knownEvidence = handout.known_evidence || [];
      const suggested = handout.suggested_actions || [];
      const rows = [
        [t("knownPeopleLabel"), knownPeople.join(", ") || t("none")],
        [t("knownEvidenceLabel"), knownEvidence.join(", ") || t("none")],
        [t("suggestedActionsTitle"), suggested.map(actionLabel).join(", ") || t("none")]
      ];
      return renderBriefingKeyValues(rows);
    }
    function renderKeeperBriefing(briefing) {
      if (!briefing) {
        keeperBriefing.textContent = state.mode === "coc" ? t("briefingUnavailable") : t("cocModeOnly");
        return;
      }
      const opening = briefing.opening || {};
      const openingActions = opening.first_turn_actions || [];
      const actions = [...openingActions, ...(briefing.spotlight_actions || [])]
        .filter((action, index, values) => values.indexOf(action) === index);
      const location = briefing.location || {};
      const investigator = briefing.investigator || {};
      const progress = briefing.progress || {};
      const notes = briefing.keeper_notes || {};
      const blockedExits = location.blocked_exits || [];
      const inventory = progress.inventory || [];
      const progressText = String(progress.discovered_clues ?? 0) + "/"
        + String(progress.total_clues ?? 0) + " " + t("discoveredSuffix")
        + ", " + String(progress.partial_clues ?? 0) + " " + t("partialLeadsMetric");
      const statusRows = [
        [t("scenarioMetric"), briefing.title || t("unknown")],
        [t("locationMetric"), location.name || t("unknown")],
        [t("investigatorLabel"), (investigator.name || t("unknown")) + " | HP "
          + (investigator.hp || "?") + " | SAN " + (investigator.sanity || "?")
          + " | Luck " + String(investigator.luck ?? "?")],
        [t("progressLabel"), progressText],
        [t("inventoryLabel"), inventory.join(", ") || t("none")],
        [t("visibleNpcsLabel"), (notes.visible_npcs || []).join(", ") || t("none")],
        [t("blockedRoutesLabel"), blockedExits.map((exit) => exit.name).join(", ") || t("none")]
      ];
      const sections = [
        "<section class=\"packet-section\"><h3>" + escapeHtml(t("briefingStatusTitle")) + "</h3>"
          + renderBriefingKeyValues(statusRows) + "</section>",
        renderBriefingTextSection(t("readAloudTitle"), opening.read_aloud, "briefing-note"),
        renderBriefingTextSection(t("investigatorHookTitle"), opening.investigator_hook),
        renderBriefingListSection(t("firstObjectivesTitle"), opening.first_objectives || []),
        renderBriefingTextSection(t("safetyNoteTitle"), opening.safety_note),
        renderBriefingListSection(t("nextMovesTitle"), briefing.next_actions || []),
        renderBriefingListSection(t("risksTitle"), briefing.risks || []),
        renderBriefingListSection(t("openThreadsTitle"), briefing.open_threads || []),
        renderBriefingClueQueue(notes.hidden_clues || []),
        renderBriefingListSection(t("recentLogTitle"), notes.recent_events || [])
      ];
      const actionButtons = renderKeeperActionButtons(actions, t("spotlightActionsTitle"));
      keeperBriefing.innerHTML = "<div class=\"briefing-view\">" + actionButtons
        + sections.filter(Boolean).join("")
        + "</div>";
      bindKeeperActionButtons();

    function renderKeeperActionButtons(actions, title) {
      if (!actions.length) return "";
      return "<section class=\"packet-section\"><h3>" + escapeHtml(title) + "</h3><div class=\"packet-actions\">"
        + actions.map((action) => {
          return "<button type=\"button\" class=\"secondary\" data-keeper-action=\""
            + escapeHtml(action) + "\">" + escapeHtml(actionLabel(action)) + "</button>";
        }).join("") + "</div></section>";
    }

    function bindKeeperActionButtons() {
      document.querySelectorAll("[data-keeper-action]").forEach((button) => {
        button.addEventListener("click", () => runAction(button.dataset.keeperAction));
      });
    }

    function renderBriefingKeyValues(rows) {
      return "<div class=\"briefing-kv\">" + rows.map(([key, value]) => {
        return "<span>" + escapeHtml(key) + "</span><strong>" + escapeHtml(value) + "</strong>";
      }).join("") + "</div>";
    }

    function renderBriefingTextSection(title, text, className = "") {
      if (!text) return "";
      const paragraphClass = className ? " class=\"" + escapeHtml(className) + "\"" : "";
      return "<section class=\"packet-section\"><h3>" + escapeHtml(title) + "</h3><p" + paragraphClass + ">"
        + escapeHtml(text) + "</p></section>";
    }

    function renderBriefingListSection(title, items) {
      const cleanItems = (items || []).filter(Boolean);
      if (!cleanItems.length) return "";
      return "<section class=\"packet-section\"><h3>" + escapeHtml(title) + "</h3><ul class=\"briefing-list\">"
        + cleanItems.map((item) => "<li>" + escapeHtml(item) + "</li>").join("")
        + "</ul></section>";
    }

    function renderBriefingClueQueue(clues) {
      if (!clues.length) return "";
      return "<section class=\"packet-section\"><h3>" + escapeHtml(t("hiddenClueQueueTitle")) + "</h3><ul class=\"briefing-list\">"
        + clues.slice(0, 6).map((clue) => {
          const gate = clue.skill ? clue.skill + " / " + clue.difficulty : t("automaticTag");
          const sanity = clue.sanity_loss ? " | SAN " + clue.sanity_loss : "";
          return "<li><strong>" + escapeHtml(clue.title || t("unknown")) + "</strong>"
            + " <span class=\"muted\">" + escapeHtml(gate + sanity) + "</span></li>";
        }).join("")
        + "</ul></section>";
    }

    function renderRecentEvents(events) {
      events.forEach((event) => {
        if (state.transcriptEventIds.has(event.id)) return;
        state.transcriptEventIds.add(event.id);
        appendTranscriptMessage(event.actor, event.content, eventMeta(event));
      });
    }

    function renderCocRecentEvents(lines) {
      lines.forEach((line) => appendTranscriptLine(line, "coc:" + line));
    }

    function appendTranscript(text) {
      if (!text) return;
      text.split(/\n+/).forEach((line) => appendTranscriptLine(line, "coc:" + line.trim()));
    }

    function appendTranscriptLine(line, key) {
      const trimmed = String(line || "").trim();
      if (!trimmed) return;
      if (key && state.transcriptEventIds.has(key)) return;
      if (key) state.transcriptEventIds.add(key);
      const parsed = trimmed.match(/^([^:\n]{1,32}):\s*([\s\S]*)$/);
      if (parsed) {
        appendTranscriptMessage(parsed[1], parsed[2]);
      } else {
        appendTranscriptMessage("Log", trimmed);
      }
    }
    function appendTranscriptMessage(actor, content, meta) {
      if (!content) return;
      const message = document.createElement("article");
      message.className = "message " + actorClass(actor);
      const label = document.createElement("strong");
      label.textContent = actor;
      const body = document.createElement("div");
      body.textContent = content;
      message.appendChild(label);
      if (meta) {
        const metaLine = document.createElement("div");
        metaLine.className = "message-meta";
        metaLine.textContent = meta;
        message.appendChild(metaLine);
      }
      message.appendChild(body);
      transcript.appendChild(message);
      transcript.scrollTop = transcript.scrollHeight;
    }

    function eventMeta(event) {
      const parts = [];
      if (event.visibility) parts.push(event.visibility);
      if (event.created_at) parts.push(new Date(event.created_at).toLocaleString());
      return parts.join(" | ");
    }

    function actorClass(actor) {
      return String(actor || "log").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    }

    function setStatus(text, error) {
      statusBox.textContent = text;
      statusBox.classList.toggle("danger", Boolean(error));
    }

    function composeCampaignStatus() {
      const lines = [t("campaignLoadedPrefix") + " " + state.campaignId + " " + t("campaignLoadedSuffix")];
      if (state.logStatus) lines.push(state.logStatus);
      return lines.join("\n");
    }

    function composeCocStatus() {
      const summary = state.cocSummary || {};
      const investigator = summary.investigator || {};
      return t("cocScenarioLoadedPrefix") + " " + state.scenarioId + " " + t("campaignLoadedSuffix") + "\n"
        + t("investigatorLabel") + ": " + (investigator.name || t("unknown"))
        + " | SAN " + String(investigator.current_sanity ?? "?")
        + " | " + (summary.completed ? t("completed") : t("inProgress"))
        + " | " + t("cluesMetric") + " " + String(summary.discovered_clue_count ?? 0)
        + "/" + String(summary.clue_count ?? 0) + ".";
    }

    function composeLogStatus(data) {
      const returned = String(data.returned_count || 0);
      const filtered = String(data.filtered_count ?? data.event_count ?? 0);
      const total = String(data.event_count || 0);
      const scope = data.visibility ? " " + data.visibility : "";
      return t("loadedLogPrefix") + " " + returned + "/" + filtered + scope + " " + t("logEventsSuffix") + ", " + total + " " + t("totalSuffix");
    }

    function setControls(enabled) {
      const dndMode = state.mode === "dnd";
      sampleButton.disabled = !enabled || !dndMode;
      briefingButton.disabled = !enabled || state.mode !== "coc";
      tablePacketButton.disabled = !enabled || state.mode !== "coc";
      playerCardButton.disabled = !enabled || state.mode !== "coc";
      refreshButton.disabled = !enabled;
      clearTranscriptButton.disabled = !enabled;
      logVisibility.disabled = !enabled || !dndMode;
      actionInput.disabled = !enabled;
      sendButton.disabled = !enabled;
      dmButton.disabled = !enabled;
      updateSuggestedActionControl();
      document.querySelectorAll("[data-action]").forEach((button) => {
        button.disabled = !enabled;
      });
    }

    function updateSuggestedActionControl() {
      runSuggestedButton.disabled = !state.pendingSuggestedAction || (state.mode === "dnd" ? !state.campaignId : !state.scenarioId);
    }

    function renderRecommendedActions(recommendations) {
      const items = recommendations || [];
      if (!items.length) {
        recommendedActions.innerHTML = "<h3>" + escapeHtml(t("recommendedActionsTitle")) + "</h3><p class=\"muted\">"
          + escapeHtml(t("recommendedEmpty")) + "</p>";
        return;
      }
      recommendedActions.innerHTML = "<h3>" + escapeHtml(t("recommendedActionsTitle")) + "</h3><div class=\"recommendation-list\">"
        + items.map((item) => {
          return "<div class=\"recommendation\"><div><strong>" + escapeHtml(actionLabel(item.action))
            + "</strong><p class=\"muted\">" + escapeHtml(recommendationReason(item.reason, item.reason_detail)) + "</p></div>"
            + "<button type=\"button\" class=\"secondary\" data-action=\"" + escapeHtml(item.action) + "\">"
            + escapeHtml(t("useButton")) + "</button></div>";
        }).join("")
        + "</div>";
      recommendedActions.querySelectorAll("[data-action]").forEach((button) => {
        button.addEventListener("click", () => runAction(button.dataset.action));
      });
    }

    function recommendCocActions(summary) {
      const actions = summary.available_actions || [];
      const groups = summary.action_groups || [];
      const recommendations = [];
      const add = (action, reason, reasonDetail = "") => {
        if (!action || recommendations.some((item) => item.action === action)) return;
        if (!actions.includes(action)) return;
        const item = { action, reason };
        if (reasonDetail) item.reason_detail = reasonDetail;
        recommendations.push(item);
      };
      const grouped = {};
      groups.forEach((group) => {
        grouped[group.label] = group.actions || [];
      });
      firstUsefulActions(grouped.Investigation || actions.filter(isInvestigationAction), 2)
        .forEach((action) => add(action, "likely_clue"));
      firstUsefulActions(grouped.NPCs || actions.filter(isNpcAction), 1)
        .forEach((action) => add(action, "npc_context"));
      firstUsefulActions(grouped.Movement || actions.filter((action) => action.startsWith("go ")), 1)
        .forEach((action) => add(action, "movement"));
      if (summary.keeper_hint) add("hint", "keeper_hint", summary.keeper_hint);
      firstUsefulActions(grouped.Case || ["progress", "clues", "inventory", "recap"], 1)
        .forEach((action) => add(action, "orientation"));
      return recommendations.slice(0, 5);
    }

    function recommendDndActions(summary) {
      const actions = summary.available_actions || [];
      const recommendations = [];
      const add = (action, reason) => {
        if (!action || recommendations.some((item) => item.action === action)) return;
        if (!actions.includes(action)) return;
        recommendations.push({ action, reason });
      };
      const combatActions = actions.filter((action) => action.startsWith("attack ") || action.startsWith("cast "));
      firstUsefulActions(combatActions, 2).forEach((action) => {
        add(action, action.startsWith("cast ") ? "magic" : "combat");
      });
      firstUsefulActions(actions.filter(isInvestigationAction), 2)
        .forEach((action) => add(action, "likely_clue"));
      firstUsefulActions(actions.filter(isNpcAction), 1)
        .forEach((action) => add(action, "npc_context"));
      firstUsefulActions(actions.filter((action) => action.startsWith("go ")), 1)
        .forEach((action) => add(action, "movement"));
      ["look", "inspect"].forEach((action) => add(action, "general"));
      return recommendations.slice(0, 5);
    }

    function recommendationReason(reason, detail = "") {
      const labels = {
        likely_clue: "reasonInvestigation",
        npc_context: "reasonNpc",
        movement: "reasonMovement",
        orientation: "reasonCase",
        health: "reasonHealth",
        combat: "reasonCombat",
        magic: "reasonMagic",
        general: "reasonGeneral",
        keeper_hint: "reasonKeeperHint",
      };
      const label = t(labels[reason] || "reasonGeneral");
      return detail ? label + " " + detail : label;
    }

    function firstUsefulActions(actions, limit) {
      return (actions || [])
        .filter((action) => action && !action.includes("<text>"))
        .filter((action) => !action.endsWith(" bonus") && !action.endsWith(" penalty"))
        .slice(0, limit);
    }

    function isInvestigationAction(action) {
      return action.startsWith("inspect ") || action.startsWith("search ")
        || action.startsWith("read ") || action.startsWith("listen ")
        || action === "look" || action === "inspect";
    }

    function isNpcAction(action) {
      return action.startsWith("talk ") || action.startsWith("ask ")
        || action.startsWith("question ") || action.startsWith("speak to ")
        || action.startsWith("speak with ");
    }

    function renderQuickActions(actions, actionGroups = []) {
      const fallback = ["look", "inspect"];
      const preferred = actions.length ? actions : fallback;
      const groups = actionGroups.length ? actionGroups : Object.entries(groupQuickActions(preferred)).map(([label, groupedActions]) => {
        return { label, actions: groupedActions };
      });
      quickActions.innerHTML = groups.map((group) => {
        const groupedActions = group.actions || [];
        return "<div class=\"quick-action-group\"><div class=\"quick-action-group-title\">" + escapeHtml(localizeQuickActionGroup(group.label || "Actions"))
          + "</div><div class=\"quick-action-buttons\">" + groupedActions.map((action) => {
            return "<button type=\"button\" class=\"secondary\" data-action=\"" + escapeHtml(action) + "\">"
              + escapeHtml(actionLabel(action)) + "</button>";
          }).join("") + "</div></div>";
      }).join("");
      bindQuickActions();
      setControls(Boolean(state.campaignId || state.scenarioId));
    }

    function groupQuickActions(actions) {
      return actions.reduce((groups, action) => {
        const label = quickActionGroupLabel(action);
        if (!groups[label]) groups[label] = [];
        groups[label].push(action);
        return groups;
      }, {});
    }

    function quickActionGroupLabel(action) {
      if (action.startsWith("san check ") || action.startsWith("take damage ")
        || action.startsWith("heal ") || action.startsWith("recover luck ")
        || action.startsWith("spend luck ") || action === "first aid") return "Health";
      if (action.startsWith("check ") || action === "skills") return "Skills";
      if (action.startsWith("note ") || action.startsWith("keeper note ")) return "Notes";
      if (action.startsWith("go ") || action === "dash" || action === "disengage" || action === "flee") return "Movement";
      if (action.startsWith("inspect ") || action.startsWith("search ") || action.startsWith("read ") || action.startsWith("listen ")) return "Investigation";
      if (action.startsWith("talk ") || action.startsWith("ask ") || action.startsWith("question ") || action.startsWith("speak to ") || action.startsWith("speak with ")) return "NPCs";
      if (action.startsWith("cast ")) return "Magic";
      if (action.startsWith("attack ") || action === "combat" || action === "dodge" || action === "surrender" || action === "accept surrender") return "Combat";
      if (action === "conclude" || action === "progress" || action === "recap" || action === "hint" || action === "clues" || action === "inventory") return "Case";
      return "General";
    }

    function localizeQuickActionGroup(labelText) {
      if (state.locale !== "zh") return labelText;
      return ({
        Health: "生命/理智",
        Skills: "技能",
        Notes: "记录",
        Movement: "移动",
        Investigation: "调查",
        NPCs: "NPC",
        Magic: "魔法",
        Combat: "战斗",
        Case: "案件",
        Keeper: "守秘人",
        General: "通用",
        Actions: "行动"
      })[labelText] || labelText;
    }

    function bindQuickActions() {
      document.querySelectorAll("[data-action]").forEach((button) => {
        button.addEventListener("click", () => runAction(button.dataset.action));
      });
    }

    function actionLabel(action) {
      if (state.locale === "zh") {
        const lower = action.toLowerCase();
        const exact = {
          look: "观察",
          inspect: "检查",
          skills: "技能",
          status: "状态",
          recap: "回顾",
          progress: "进度",
          hint: "提示",
          inventory: "物品",
          clues: "线索",
          sanity: "理智",
          conclude: "结案",
          quit: "退出",
          combat: "进入战斗",
          dodge: "闪避",
          dash: "疾走",
          disengage: "脱离",
          flee: "逃跑",
          surrender: "投降",
          "accept surrender": "接受投降",
          "first aid": "急救"
        };
        if (exact[lower]) return exact[lower];
        const prefixes = [
          ["speak with ", "交谈 "],
          ["speak to ", "交谈 "],
          ["ask ", "询问 "],
          ["question ", "盘问 "],
          ["talk ", "交谈 "],
          ["inspect ", "检查 "],
          ["search ", "搜索 "],
          ["read ", "阅读 "],
          ["listen ", "聆听 "],
          ["go ", "前往 "],
          ["check ", "检定 "],
          ["san check ", "理智检定 "],
          ["take damage ", "受到伤害 "],
          ["heal ", "治疗 "],
          ["recover luck ", "恢复幸运 "],
          ["spend luck ", "花费幸运 "],
          ["note ", "记录 "],
          ["keeper note ", "守秘人记录 "],
          ["cast ", "施放 "],
          ["attack ", "攻击 "]
        ];
        for (const [prefix, replacement] of prefixes) {
          if (lower.startsWith(prefix)) return replacement + action.slice(prefix.length);
        }
      }
      return action.replace(/\b\w/g, (letter) => letter.toUpperCase());
    }

    function featureLabel(enabled) {
      return enabled ? t("enabled") : t("disabled");
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (character) => {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "\"": "&quot;",
          "'": "&#039;"
        }[character];
      });
    }

  </script>
</body>
</html>
