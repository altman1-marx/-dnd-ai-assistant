<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DND AI Assistant</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f1e8;
      --surface: #fffaf0;
      --surface-2: #f0f7f4;
      --ink: #221f1a;
      --muted: #6e675c;
      --line: #d6cfc0;
      --accent: #1f6f78;
      --accent-2: #8f3f35;
      --focus: #2f6fed;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      min-height: 38px;
      padding: 0 12px;
      cursor: pointer;
    }

    button.secondary {
      background: var(--surface);
      color: var(--accent);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 9px 10px;
    }

    textarea {
      min-height: 88px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    button:focus {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(250px, 320px) minmax(0, 1fr) minmax(260px, 360px);
      min-height: 100vh;
    }

    .sidebar,
    .panel {
      border-right: 1px solid var(--line);
      background: var(--surface);
      padding: 18px;
      overflow: auto;
    }

    .panel {
      border-right: 0;
      border-left: 1px solid var(--line);
      background: var(--surface-2);
    }

    main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 18px;
      gap: 14px;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: 22px;
      line-height: 1.2;
    }

    h2 {
      font-size: 15px;
      margin-bottom: 8px;
    }

    h3 {
      font-size: 14px;
      margin-bottom: 6px;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .stack {
      display: grid;
      gap: 12px;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .row > * {
      flex: 1;
    }

    .compact-row {
      flex: 0 0 auto;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
    }

    .status {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      padding: 10px;
      color: var(--muted);
      min-height: 40px;
      white-space: pre-wrap;
    }

    .transcript {
      flex: 1;
      min-height: 320px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      padding: 14px;
      overflow: auto;
      line-height: 1.45;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      padding: 10px;
      white-space: pre-wrap;
    }

    .message strong {
      display: block;
      color: var(--accent);
      font-size: 12px;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .message-meta {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 6px;
    }

    .message.system strong {
      color: var(--muted);
    }

    .message.ai-dm strong {
      color: var(--accent-2);
    }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .metric {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      padding: 8px 0;
      font-size: 14px;
    }

    .list {
      display: grid;
      gap: 8px;
    }

    .rules-results {
      display: grid;
      gap: 8px;
    }

    .campaign-list {
      display: grid;
      gap: 8px;
    }

    .campaign-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 6px;
      align-items: center;
    }

    .campaign-row button {
      min-height: 32px;
      padding: 0 9px;
    }

    .item {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      padding: 10px;
    }

    .item strong {
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .item .score {
      color: var(--muted);
      font-size: 12px;
    }

    .danger {
      color: var(--accent-2);
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar,
      .panel {
        border: 0;
        border-bottom: 1px solid var(--line);
      }

      .quick-actions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar stack">
      <header class="stack">
        <h1>DND AI Assistant</h1>
        <p class="muted">Local campaign console for the lightweight API.</p>
      </header>

      <section class="stack" aria-labelledby="api-title">
        <h2 id="api-title">API</h2>
        <label>
          <span class="muted">Base URL</span>
          <input id="apiBase" value="http://127.0.0.1:8000" autocomplete="off">
        </label>
        <button id="healthButton" type="button" class="secondary">Check API</button>
      </section>

      <section class="stack" aria-labelledby="import-title">
        <h2 id="import-title">Adventure</h2>
        <input id="adventureFile" type="file" accept="application/json,.json">
        <button id="importButton" type="button">Import Adventure</button>
        <button id="demoButton" type="button" class="secondary">Start Demo</button>
        <button id="sampleButton" type="button" class="secondary" disabled>Add Sample Character</button>
      </section>

      <section class="stack" aria-labelledby="coc-title">
        <h2 id="coc-title">Call of Cthulhu</h2>
        <input id="cocFile" type="file" accept="application/json,.json">
        <button id="cocImportButton" type="button">Import COC Scenario</button>
        <textarea id="cocPremise" placeholder="COC premise, e.g. A lake reflects the wrong moon."></textarea>
        <button id="cocGenerateButton" type="button" class="secondary">Generate COC Scenario</button>
        <button id="cocDemoButton" type="button" class="secondary">Start COC Demo</button>
        <div id="cocList" class="campaign-list"></div>
      </section>

      <section class="stack" aria-labelledby="campaign-title">
        <h2 id="campaign-title">Campaign</h2>
        <div id="status" class="status">No campaign loaded.</div>
        <button id="campaignsButton" type="button" class="secondary">Refresh Campaigns</button>
        <div id="campaignList" class="campaign-list"></div>
      </section>
    </aside>

    <main>
      <div class="toolbar">
        <div>
          <h2>Table</h2>
          <p id="locationLine" class="muted">Import an adventure to begin.</p>
        </div>
        <div class="row compact-row">
          <select id="logVisibility" disabled aria-label="Log visibility">
            <option value="">All Logs</option>
            <option value="public">Public</option>
            <option value="dm_only">DM Only</option>
          </select>
          <button id="refreshButton" type="button" class="secondary" disabled>Refresh</button>
          <button id="clearTranscriptButton" type="button" class="secondary" disabled>Clear Log View</button>
        </div>
      </div>

      <section id="transcript" class="transcript" aria-live="polite"></section>

      <section class="stack" aria-label="Action input">
        <div class="quick-actions">
          <button type="button" class="secondary" data-action="look">Look</button>
          <button type="button" class="secondary" data-action="inspect">Inspect</button>
        </div>
        <div class="row">
          <input id="actionInput" placeholder="Type an action, e.g. go old road" autocomplete="off" disabled>
          <button id="sendButton" type="button" disabled>Send</button>
          <button id="dmButton" type="button" class="secondary" disabled>DM Suggest</button>
          <button id="runSuggestedButton" type="button" class="secondary" disabled>Run Suggested</button>
        </div>
      </section>
    </main>

    <aside class="panel stack">
      <section>
        <h2>Summary</h2>
        <div id="metrics"></div>
      </section>

      <section>
        <h2>Characters</h2>
        <div id="characters" class="list"></div>
      </section>

      <section>
        <h2 id="activityTitle">Combat</h2>
        <div id="combat" class="list"></div>
      </section>

      <section class="stack" aria-labelledby="rules-title">
        <h2 id="rules-title">Rules</h2>
        <input id="rulesQuery" placeholder="Search rules, e.g. grapple attack action" autocomplete="off">
        <button id="rulesButton" type="button" class="secondary">Search Rules</button>
        <div id="rulesResults" class="rules-results"></div>
      </section>
    </aside>
  </div>

  <script>
    const state = {
      mode: "dnd",
      campaignId: "",
      scenarioId: "",
      campaigns: [],
      cocScenarios: [],
      summary: null,
      cocSummary: null,
      cocReview: null,
      pendingSuggestedAction: "",
      lastRulesQuery: "",
      logStatus: "",
      transcriptEventIds: new Set()
    };

    const apiBase = document.getElementById("apiBase");
    const adventureFile = document.getElementById("adventureFile");
    const cocFile = document.getElementById("cocFile");
    const cocPremise = document.getElementById("cocPremise");
    const statusBox = document.getElementById("status");
    const transcript = document.getElementById("transcript");
    const campaignList = document.getElementById("campaignList");
    const cocList = document.getElementById("cocList");
    const locationLine = document.getElementById("locationLine");
    const metrics = document.getElementById("metrics");
    const characters = document.getElementById("characters");
    const combat = document.getElementById("combat");
    const rulesQuery = document.getElementById("rulesQuery");
    const rulesResults = document.getElementById("rulesResults");
    const actionInput = document.getElementById("actionInput");
    const sendButton = document.getElementById("sendButton");
    const dmButton = document.getElementById("dmButton");
    const runSuggestedButton = document.getElementById("runSuggestedButton");
    const sampleButton = document.getElementById("sampleButton");
    const refreshButton = document.getElementById("refreshButton");
    const clearTranscriptButton = document.getElementById("clearTranscriptButton");
    const logVisibility = document.getElementById("logVisibility");
    const quickActions = document.querySelector(".quick-actions");
    const activityTitle = document.getElementById("activityTitle");

    document.getElementById("healthButton").addEventListener("click", checkHealth);
    document.getElementById("importButton").addEventListener("click", importAdventure);
    document.getElementById("demoButton").addEventListener("click", loadDemoAdventure);
    document.getElementById("cocImportButton").addEventListener("click", importCocScenario);
    document.getElementById("cocGenerateButton").addEventListener("click", generateCocScenario);
    document.getElementById("cocDemoButton").addEventListener("click", loadCocDemo);
    document.getElementById("campaignsButton").addEventListener("click", refreshCampaigns);
    sampleButton.addEventListener("click", addSampleCharacter);
    refreshButton.addEventListener("click", refreshCampaignView);
    clearTranscriptButton.addEventListener("click", clearTranscriptView);
    logVisibility.addEventListener("change", reloadCampaignLog);
    document.getElementById("rulesButton").addEventListener("click", searchRules);
    rulesQuery.addEventListener("keydown", (event) => {
      if (event.key === "Enter") searchRules();
    });
    sendButton.addEventListener("click", sendTypedAction);
    dmButton.addEventListener("click", suggestTypedAction);
    runSuggestedButton.addEventListener("click", runSuggestedAction);
    actionInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") sendTypedAction();
    });
    bindQuickActions();

    setControls(false);
    checkHealth();
    refreshCampaigns();

    async function checkHealth() {
      try {
        const data = await api("GET", "/health");
        if (data.ok) {
          const features = data.features || {};
          setStatus([
            "API is ready.",
            "Campaigns: " + String(data.campaign_count || 0),
            "COC: " + String(data.coc_scenario_count || 0),
            "Rules: " + featureLabel(features.rules_search),
            "AI DM: " + featureLabel(features.ai_dm),
            "Persistence: " + featureLabel(features.persistent_state)
          ].join("\n"));
        } else {
          setStatus("API responded without ok=true.");
        }
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    async function importAdventure() {
      const file = adventureFile.files[0];
      if (!file) {
        setStatus("Choose an adventure JSON file first.", true);
        return;
      }
      try {
        const adventure = JSON.parse(await file.text());
        const data = await api("POST", "/campaigns/import", { adventure });
        state.mode = "dnd";
        state.campaignId = data.campaign_id;
        state.scenarioId = "";
        appendTranscriptMessage("System", "Imported " + data.campaign.title + ".");
        setControls(true);
        await refreshCampaigns();
        await refreshCampaignView();
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    async function loadDemoAdventure() {
      try {
        const data = await api("POST", "/campaigns/demo-with-character", {});
        state.mode = "dnd";
        state.campaignId = data.campaign_id;
        state.scenarioId = "";
        appendTranscriptMessage("System", "Started demo adventure " + data.campaign.title + " with Leth.");
        setControls(true);
        await refreshCampaigns();
        await refreshCampaignView();
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    async function loadCocDemo() {
      try {
        const data = await api("POST", "/coc/demo", {});
        if (state.scenarioId !== data.scenario_id || state.mode !== "coc") clearTranscriptView();
        state.mode = "coc";
        state.scenarioId = data.scenario_id;
        state.campaignId = "";
        appendTranscriptMessage("System", "Started COC scenario " + data.scenario.title + ".");
        setControls(true);
        await refreshCampaigns();
        await refreshCocView();
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    async function importCocScenario() {
      const file = cocFile.files[0];
      if (!file) {
        setStatus("Choose a COC scenario JSON file first.", true);
        return;
      }
      try {
        const scenario = JSON.parse(await file.text());
        const data = await api("POST", "/coc/import", { scenario });
        clearTranscriptView();
        state.mode = "coc";
        state.scenarioId = data.scenario_id;
        state.campaignId = "";
        appendTranscriptMessage("System", "Imported COC scenario " + data.scenario.title + ".");
        setControls(true);
        await refreshCampaigns();
        await refreshCocView();
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    async function generateCocScenario() {
      const premise = cocPremise.value.trim();
      if (!premise) {
        setStatus("Enter a COC premise first.", true);
        return;
      }
      try {
        const data = await api("POST", "/coc/generate", {
          premise,
          max_attempts: 2,
          require_review_ok: true
        });
        clearTranscriptView();
        state.mode = "coc";
        state.scenarioId = data.scenario_id;
        state.campaignId = "";
        state.cocReview = data.review || null;
        appendTranscriptMessage("System", "Generated COC scenario " + data.scenario.title + ".");
        setControls(true);
        await refreshCampaigns();
        await refreshCocView();
      } catch (error) {
        appendTranscriptMessage("System", setupHint(error));
        setStatus(error.message, true);
      }
    }

    async function addSampleCharacter() {
      if (!state.campaignId) return;
      try {
        const data = await api("POST", "/campaigns/" + state.campaignId + "/sample-character", {});
        appendTranscriptMessage("System", "Added " + data.character.name + ".");
        await refreshCampaignView();
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    async function refreshCampaignView() {
      if (state.mode === "coc") {
        await refreshCocView();
        return;
      }
      if (!state.campaignId) return;
      await refreshCampaignLog();
      await refreshSummary();
    }

    async function refreshCocView() {
      if (!state.scenarioId) return;
      try {
        state.cocSummary = await api("GET", "/coc/" + state.scenarioId + "/summary");
        state.cocReview = await api("GET", "/coc/" + state.scenarioId + "/review");
        renderCocSummary();
        setStatus(composeCocStatus());
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    async function refreshSummary() {
      if (!state.campaignId) return;
      try {
        state.summary = await api("GET", "/campaigns/" + state.campaignId + "/summary");
        renderSummary();
        if (!logVisibility.value) renderRecentEvents(state.summary.recent_events || []);
        setStatus(composeCampaignStatus());
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    async function refreshCampaigns() {
      try {
        const data = await api("GET", "/campaigns");
        const cocData = await api("GET", "/coc");
        state.campaigns = data.campaigns || [];
        state.cocScenarios = cocData.scenarios || data.coc_scenarios || [];
        renderCampaignList();
      } catch (error) {
        campaignList.innerHTML = "<p class=\"muted\">Campaign list unavailable.</p>";
        cocList.innerHTML = "<p class=\"muted\">COC list unavailable.</p>";
        setStatus(error.message, true);
      }
    }

    async function loadCampaign(campaignId) {
      if (state.campaignId !== campaignId) {
        transcript.innerHTML = "";
        state.transcriptEventIds.clear();
      }
      state.mode = "dnd";
      state.campaignId = campaignId;
      state.scenarioId = "";
      setControls(true);
      await refreshCampaignView();
    }

    async function loadCocScenario(scenarioId) {
      if (state.scenarioId !== scenarioId || state.mode !== "coc") {
        transcript.innerHTML = "";
        state.transcriptEventIds.clear();
      }
      state.mode = "coc";
      state.scenarioId = scenarioId;
      state.campaignId = "";
      setControls(true);
      await refreshCocView();
    }

    async function refreshCampaignLog() {
      if (!state.campaignId) return;
      try {
        const visibility = logVisibility.value ? "&visibility=" + encodeURIComponent(logVisibility.value) : "";
        const data = await api("GET", "/campaigns/" + state.campaignId + "/log?limit=50" + visibility);
        renderRecentEvents(data.events || []);
        state.logStatus = composeLogStatus(data);
        setStatus(state.summary ? composeCampaignStatus() : state.logStatus);
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    async function reloadCampaignLog() {
      clearTranscriptView();
      await refreshCampaignLog();
    }

    async function deleteCampaign(campaignId) {
      try {
        await api("DELETE", "/campaigns/" + campaignId);
        if (state.campaignId === campaignId) clearCampaign();
        await refreshCampaigns();
        setStatus("Deleted campaign " + campaignId + ".");
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    async function sendTypedAction() {
      const action = actionInput.value.trim();
      if (!action) return;
      actionInput.value = "";
      await runAction(action);
    }

    async function suggestTypedAction() {
      const action = actionInput.value.trim() || state.lastRulesQuery;
      if (!action || (!state.campaignId && !state.scenarioId)) return;
      if (state.mode === "coc") {
        await suggestCocAction(action);
        return;
      }
      try {
        const data = await api("POST", "/campaigns/" + state.campaignId + "/dm-suggestion", { action });
        state.pendingSuggestedAction = action;
        actionInput.value = action;
        updateSuggestedActionControl();
        appendTranscriptMessage("AI DM", data.suggestion.text);
        if (data.suggestion.rules && data.suggestion.rules.length) {
          renderRulesResults(data.suggestion.rules);
          appendTranscriptMessage("Rules", ruleSourceSummary(data.suggestion.rules));
        }
        setStatus("AI DM suggestion ready. " + dmSuggestionMetadata(data.metadata));
      } catch (error) {
        appendTranscriptMessage("System", setupHint(error));
        setStatus(error.message, true);
      }
    }

    async function suggestCocAction(action) {
      try {
        const data = await api("POST", "/coc/" + state.scenarioId + "/keeper-suggestion", { action });
        state.pendingSuggestedAction = action;
        actionInput.value = action;
        updateSuggestedActionControl();
        appendTranscriptMessage("AI Keeper", data.suggestion.text);
        setStatus("AI Keeper suggestion ready. Action: " + action + ".");
      } catch (error) {
        appendTranscriptMessage("System", setupHint(error));
        setStatus(error.message, true);
      }
    }

    async function runSuggestedAction() {
      if (!state.pendingSuggestedAction) return;
      const action = state.pendingSuggestedAction;
      state.pendingSuggestedAction = "";
      updateSuggestedActionControl();
      await runAction(action);
    }

    async function runAction(action) {
      if (state.mode === "coc") {
        await runCocAction(action);
        return;
      }
      if (!state.campaignId) return;
      if (state.pendingSuggestedAction === action) {
        state.pendingSuggestedAction = "";
        updateSuggestedActionControl();
      }
      try {
        const data = await api("POST", "/campaigns/" + state.campaignId + "/actions", {
          action,
          seed: 5
        });
        appendTranscript(data.transcript);
        (data.messages || []).forEach((message) => state.transcriptEventIds.add(message.id));
        await refreshSummary();
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    async function runCocAction(action) {
      if (!state.scenarioId) return;
      try {
        const data = await api("POST", "/coc/" + state.scenarioId + "/actions", {
          action,
          seed: 5
        });
        appendTranscript(data.transcript);
        state.cocSummary = data.summary;
        renderCocSummary();
        setStatus(composeCocStatus());
        await refreshCampaigns();
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    async function searchRules() {
      const query = rulesQuery.value.trim();
      if (!query) {
        rulesResults.innerHTML = "<p class=\"muted\">Enter a rules query.</p>";
        return;
      }
      try {
        state.lastRulesQuery = query;
        const data = await api("POST", "/rules/search", { query, limit: 5 });
        renderRulesResults(data.results || []);
        setStatus("Rules search returned " + (data.results || []).length + " result(s).");
      } catch (error) {
        rulesResults.innerHTML = "<p class=\"muted\">" + escapeHtml(setupHint(error)) + "</p>";
        setStatus(error.message, true);
      }
    }

    async function api(method, path, body) {
      const options = {
        method,
        headers: { "Content-Type": "application/json" }
      };
      if (body !== undefined) options.body = JSON.stringify(body);
      const response = await fetch(apiBase.value.replace(/\/$/, "") + path, options);
      const data = await response.json();
      if (!response.ok) throw apiErrorFromResponse(data);
      return data;
    }

    function apiErrorFromResponse(data) {
      const error = data.error || {};
      const message = error.message || data.error_message || "Request failed.";
      const wrapped = new Error(message);
      wrapped.code = error.code || "request_failed";
      return wrapped;
    }

    function setupHint(error) {
      if (error.code === "ai_provider_not_configured") {
        return "Start the API with --ai-provider openai-compatible to enable AI DM suggestions.";
      }
      if (error.code === "rules_corpus_not_configured") {
        return "Start the API with --rules-corpus .dnd_ai\\rules\\srd_5_2_1.jsonl to enable rules search.";
      }
      if (error.code === "ai_provider_error") {
        return "The AI provider request failed. Check the model, base URL, API key, and provider quota.";
      }
      return error.message;
    }

    function renderSummary() {
      const summary = state.summary;
      const location = summary.current_location;
      locationLine.textContent = location ? location.name + " - " + location.public_description : "No current location.";
      metrics.innerHTML = [
        metric("Campaign", summary.title),
        metric("Party level", summary.party_level),
        metric("Location ID", summary.current_location_id || "None"),
        metric("Characters", summary.characters.length),
        metric("Quests", summary.active_quest_count + "/" + summary.quest_count + " active"),
        metric("Clues", summary.discovered_clue_count + "/" + summary.clue_count + " discovered"),
        metric("Exit count", location ? location.exits.length : 0),
        metric("Exits", location ? location.exits.map((exit) => exit.name).join(", ") || "None" : "None"),
        metric("NPC count", location ? location.npcs.length : 0),
        metric("NPCs", location ? location.npcs.map((npc) => npc.name).join(", ") || "None" : "None")
      ].join("");
      renderQuickActions(summary.available_actions || []);

      characters.innerHTML = summary.characters.length
        ? summary.characters.map(renderCharacter).join("")
        : "<p class=\"muted\">No characters yet.</p>";

      activityTitle.textContent = "Combat";
      combat.innerHTML = summary.active_combat
        ? renderCombat(summary.active_combat, summary.available_actions || [])
        : "<p class=\"muted\">No active combat.</p>";
      bindQuickActions();
    }

    function renderCocSummary() {
      const summary = state.cocSummary;
      if (!summary) return;
      const investigator = summary.investigator || {};
      const review = state.cocReview || {};
      const blockedExits = (summary.exits || []).filter((exit) => exit.available === false);
      locationLine.textContent = summary.location + " - " + summary.description;
      metrics.innerHTML = [
        metric("Scenario", summary.title),
        metric("System", "Call of Cthulhu 7e"),
        metric("Location", summary.location),
        metric("Exits", (summary.exits || []).map((exit) => exit.name).join(", ") || "None"),
        metric("Blocked Exits", blockedExits.map((exit) => exit.name).join(", ") || "None"),
        metric("Ending", completionProgressLabel(summary.completion_progress || {})),
        metric("Keeper Hint", summary.keeper_hint || "None"),
        metric("Status", summary.completed ? "Completed" : "In progress"),
        metric("Review", review.ok ? "OK" : "Needs attention"),
        metric("Review Findings", (review.findings || []).length),
        metric("NPCs", (summary.npcs || []).map((npc) => npc.name).join(", ") || "None"),
        metric("Clues", summary.discovered_clue_count + "/" + summary.clue_count + " discovered"),
        metric("Partial Leads", summary.partial_clue_count || 0),
        metric("Evidence", (summary.inventory || []).length),
        metric("Available Actions", (summary.available_actions || []).length)
      ].join("");
      renderQuickActions(summary.available_actions || []);
      characters.innerHTML = renderInvestigator(investigator);
      activityTitle.textContent = "Investigation";
      combat.innerHTML = renderCocInvestigationPanel(summary, review);
    }


    function completionProgressLabel(progress) {
      const groups = Object.values(progress);
      if (!groups.length) return "Legacy clue ending";
      const required = groups.reduce((total, group) => total + ((group.required || []).length), 0);
      const remaining = groups.reduce((total, group) => total + ((group.remaining || []).length), 0);
      if (!required) return "No explicit gates";
      return String(required - remaining) + "/" + String(required) + " met";
    }

    function renderInvestigator(investigator) {
      return "<div class=\"item\"><strong>" + escapeHtml(investigator.name || "Investigator")
        + "</strong><p>HP " + escapeHtml(String(investigator.current_hp))
        + "/" + escapeHtml(String(investigator.max_hp))
        + " | MP " + escapeHtml(String(investigator.current_mp ?? investigator.current_magic_points))
        + "/" + escapeHtml(String(investigator.max_mp ?? investigator.max_magic_points))
        + "</p><p>SAN " + escapeHtml(String(investigator.current_sanity))
        + "/" + escapeHtml(String(investigator.max_sanity))
        + " | Luck " + escapeHtml(String(investigator.luck))
        + "</p><p class=\"muted\">Conditions "
        + escapeHtml((investigator.conditions || []).join(", ") || "none") + "</p></div>";
    }

    function renderCocInvestigationPanel(summary, review) {
      const sections = [
        renderCocProgress(summary.completion_progress || {}),
        renderCocExits(summary.exits || []),
        renderCocNpcs(summary.npcs || []),
        renderCocDiscoveredClues(summary.discovered_clues || []),
        renderCocEvidence(summary.inventory || []),
        renderCocPartialClues(summary.partial_clues || [])
      ];
      if (review.findings && review.findings.length) {
        sections.push(renderCocReviewFindings(review.findings));
      }
      return sections.filter(Boolean).join("");
    }

    function renderCocProgress(progress) {
      const groups = Object.entries(progress);
      if (!groups.length) return "";
      return "<div class=\"item\"><strong>Ending Progress</strong>" + groups.map(([key, group]) => {
        return "<p>" + escapeHtml(cocProgressLabel(key)) + ": "
          + escapeHtml(String((group.met || []).length)) + "/" + escapeHtml(String((group.required || []).length))
          + " met</p>" + renderCocRemaining(group.remaining || []);
      }).join("") + "</div>";
    }

    function renderCocRemaining(remaining) {
      if (!remaining.length) return "";
      return "<p class=\"muted\">Remaining " + escapeHtml(remaining.join(", ")) + "</p>";
    }

    function cocProgressLabel(key) {
      return ({
        required_clue_ids: "Required clues",
        required_evidence: "Required evidence",
        required_location_ids: "Required locations",
        required_npc_ids: "Required NPCs"
      })[key] || key.replaceAll("_", " ");
    }

    function renderCocExits(exits) {
      if (!exits.length) return "<div class=\"item\"><strong>Exits</strong><p class=\"muted\">No visible exits.</p></div>";
      return "<div class=\"item\"><strong>Exits</strong>" + exits.map((exit) => {
        const state = exit.available === false ? "blocked" : "open";
        return "<p>" + escapeHtml(exit.name) + " <span class=\"muted\">" + escapeHtml(state) + "</span></p>";
      }).join("") + "</div>";
    }

    function renderCocNpcs(npcs) {
      if (!npcs.length) return "<div class=\"item\"><strong>NPCs</strong><p class=\"muted\">No visible NPCs.</p></div>";
      return npcs.map((npc) => {
        return "<div class=\"item\"><strong>" + escapeHtml(npc.name)
          + "</strong><p>" + escapeHtml(npc.description || "")
          + "</p><p class=\"muted\">NPC</p></div>";
      }).join("");
    }

    function renderCocDiscoveredClues(clues) {
      if (!clues.length) return "<div class=\"item\"><strong>Discovered Clues</strong><p class=\"muted\">No confirmed clues yet.</p></div>";
      return clues.map((clue) => {
        return "<div class=\"item\"><strong>Clue: " + escapeHtml(clue.title)
          + "</strong><p>" + escapeHtml(clue.text || "") + "</p></div>";
      }).join("");
    }
    function renderCocEvidence(items) {
      if (!items.length) return "<p class=\"muted\">No evidence collected.</p>";
      return items.map((item) => {
        return "<div class=\"item\"><strong>" + escapeHtml(item) + "</strong><p class=\"muted\">Evidence</p></div>";
      }).join("");
    }

    function renderCocPartialClues(clues) {
      if (!clues.length) return "";
      return clues.map((clue) => {
        return "<div class=\"item\"><strong>Partial lead: " + escapeHtml(clue.title)
          + "</strong><p>" + escapeHtml(clue.text || "")
          + "</p><p class=\"muted\">" + escapeHtml(partialLeadMeta(clue)) + "</p></div>";
      }).join("");
    }

    function partialLeadMeta(clue) {
      const parts = [];
      if (clue.evidence) parts.push(clue.evidence);
      if (clue.luck_cost) parts.push("Luck cost " + String(clue.luck_cost));
      return parts.join(" | ") || "Unconfirmed lead";
    }
    function renderCocReviewFindings(findings) {
      return findings.map((finding) => {
        return "<div class=\"item\"><strong>" + escapeHtml(finding.code)
          + "</strong><p>" + escapeHtml(finding.message)
          + "</p><p class=\"muted\">" + escapeHtml(finding.severity) + "</p></div>";
      }).join("");
    }

    function renderCampaignList() {
      if (!state.campaigns.length) {
        campaignList.innerHTML = "<p class=\"muted\">No in-memory campaigns.</p>";
      } else {
        campaignList.innerHTML = state.campaigns.map((campaign) => {
          const active = state.mode === "dnd" && campaign.id === state.campaignId ? "Active" : "Open";
          return "<div class=\"item campaign-row\"><div><strong>" + escapeHtml(campaign.title)
            + "</strong><p class=\"muted\">" + escapeHtml(campaign.id)
            + " | Level " + escapeHtml(String(campaign.party_level))
            + " | " + escapeHtml(campaign.current_location_name || "No location")
            + " | Characters " + escapeHtml(String(campaign.character_count))
            + " | Combat " + escapeHtml(campaign.active_combat ? "active" : "none")
            + " | Events " + escapeHtml(String(campaign.session_event_count || 0))
            + "</p></div><button type=\"button\" class=\"secondary\" data-load-campaign=\"" + escapeHtml(campaign.id)
            + "\">" + active + "</button><button type=\"button\" class=\"secondary danger\" data-delete-campaign=\""
            + escapeHtml(campaign.id) + "\">Delete</button></div>";
        }).join("");
      }
      cocList.innerHTML = state.cocScenarios.length ? state.cocScenarios.map((scenario) => {
        const active = state.mode === "coc" && scenario.id === state.scenarioId ? "Active" : "Open";
        return "<div class=\"item campaign-row\"><div><strong>" + escapeHtml(scenario.title)
          + "</strong><p class=\"muted\">" + escapeHtml(scenario.id)
          + " | " + escapeHtml(scenario.system_id || "coc7e")
          + " | " + escapeHtml(scenario.location || "No location")
          + " | " + escapeHtml(scenario.investigator_name || "Investigator")
          + " | SAN " + escapeHtml(String(scenario.current_sanity))
          + " | " + escapeHtml(scenario.completed ? "completed" : "active")
          + " | Evidence " + escapeHtml(String(scenario.inventory_count || 0))
          + " | Clues " + escapeHtml(String(scenario.discovered_clue_count))
          + "/" + escapeHtml(String(scenario.clue_count))
          + " | Partial " + escapeHtml(String(scenario.partial_clue_count || 0))
          + " | Events " + escapeHtml(String(scenario.session_event_count || 0))
          + " | Ending " + escapeHtml(completionCountLabel(scenario))
          + "</p></div><button type=\"button\" class=\"secondary\" data-load-coc=\""
          + escapeHtml(scenario.id) + "\">" + active + "</button></div>";
      }).join("") : "<p class=\"muted\">No COC scenarios.</p>";
      document.querySelectorAll("[data-load-campaign]").forEach((button) => {
        button.addEventListener("click", () => loadCampaign(button.dataset.loadCampaign));
      });
      document.querySelectorAll("[data-delete-campaign]").forEach((button) => {
        button.addEventListener("click", () => deleteCampaign(button.dataset.deleteCampaign));
      });
      document.querySelectorAll("[data-load-coc]").forEach((button) => {
        button.addEventListener("click", () => loadCocScenario(button.dataset.loadCoc));
      });
    }

    function completionCountLabel(scenario) {
      const required = Number(scenario.completion_required_count || 0);
      const remaining = Number(scenario.completion_remaining_count || 0);
      if (!required) return "legacy";
      return String(required - remaining) + "/" + String(required);
    }
function clearCampaign() {
      state.mode = "dnd";
      state.campaignId = "";
      state.scenarioId = "";
      state.summary = null;
      state.cocSummary = null;
      state.pendingSuggestedAction = "";
      state.logStatus = "";
      clearTranscriptView();
      locationLine.textContent = "Import an adventure to begin.";
      metrics.innerHTML = "";
      characters.innerHTML = "";
      activityTitle.textContent = "Combat";
      combat.innerHTML = "";
      setControls(false);
    }

    function clearTranscriptView() {
      state.transcriptEventIds.clear();
      transcript.innerHTML = "";
    }

    function metric(label, value) {
      return "<div class=\"metric\"><span>" + escapeHtml(label) + "</span><strong>" + escapeHtml(String(value)) + "</strong></div>";
    }

    function renderCharacter(character) {
      const deathSaves = character.death_saves || { successes: 0, failures: 0 };
      const spellcasting = character.spellcasting
        ? "<p class=\"muted\">Slots " + character.spellcasting.slots.map((slot) => {
            return escapeHtml("L" + slot.level + " " + slot.available + "/" + slot.total);
          }).join(", ") + "</p><p class=\"muted\">Concentration "
          + escapeHtml(character.spellcasting.concentration_spell_name || "none")
          + "</p><p class=\"muted\">" + character.spellcasting.known_spells.map((spell) => escapeHtml(spell.name)).join(", ") + "</p>"
        : "";
      return "<div class=\"item\"><strong>" + escapeHtml(character.name) + "</strong><p class=\"muted\">Level "
        + escapeHtml(String(character.level)) + " " + escapeHtml(character.ancestry) + " "
        + escapeHtml(character.class_name) + "</p><p>HP "
        + escapeHtml(String(character.current_hp)) + "/" + escapeHtml(String(character.max_hp))
        + " | AC " + escapeHtml(String(character.armor_class)) + "</p><p class=\"muted\">Conditions "
        + escapeHtml((character.conditions || []).join(", ") || "none") + "</p><p class=\"muted\">Death saves "
        + escapeHtml(String(deathSaves.successes || 0)) + "S / " + escapeHtml(String(deathSaves.failures || 0))
        + "F</p>" + spellcasting + "</div>";
    }

    function renderCombat(activeCombat, availableActions) {
      const resources = activeCombat.current_resources || {};
      const lines = [
        metric("Round", activeCombat.round),
        metric("Turn", activeCombat.turn || "unknown"),
        metric("Combatants", activeCombat.combatant_count || 0),
        metric("Action", resourceLabel(resources.action)),
        metric("Bonus", resourceLabel(resources.bonus_action)),
        metric("Reaction", resourceLabel(resources.reaction)),
        metric("Movement", String(resources.movement ?? 0) + " ft"),
        metric("Monster AI", activeCombat.monster_action_strategy || "default_attack"),
        metric("Last Auto", activeCombat.last_automatic_action || "none"),
        metric("Morale", activeCombat.morale_hint || "steady"),
        metric("Targets", (activeCombat.targetable_enemies || []).join(", ") || "none")
      ];
      const initiative = activeCombat.initiative || [];
      lines.push(initiative.map((entry) => {
        const deathSaves = entry.death_saves || { successes: 0, failures: 0 };
        const conditions = (entry.conditions || []).join(", ") || "none";
        return "<div class=\"item\"><strong>" + escapeHtml(entry.name || "unknown") + "</strong><p class=\"muted\">Initiative "
          + escapeHtml(String(entry.initiative_total)) + " | AC " + escapeHtml(String(entry.armor_class || "?"))
          + " | HP " + escapeHtml(String(entry.current_hp || "?"))
          + " | " + escapeHtml(entry.defeated ? "defeated" : "active") + "</p><p class=\"muted\">Conditions "
          + escapeHtml(conditions) + " | Death saves " + escapeHtml(String(deathSaves.successes || 0))
          + "S / " + escapeHtml(String(deathSaves.failures || 0)) + "F</p></div>";
      }).join(""));
      const targetActions = combatTargetActions(activeCombat, availableActions || []);
      if (targetActions.length) {
        lines.push("<div class=\"item\"><strong>Target Actions</strong><p>" + targetActions.map((action) => {
          return "<button type=\"button\" class=\"secondary\" data-action=\"" + escapeHtml(action) + "\">"
            + escapeHtml(actionLabel(action)) + "</button>";
        }).join(" ") + "</p></div>");
      }
      return lines.join("");
    }

    function combatTargetActions(activeCombat, availableActions) {
      const targets = (activeCombat.targetable_enemies || []).concat(activeCombat.targetable_allies || []);
      return availableActions.filter((action) => {
        const normalized = action.toLowerCase();
        return targets.some((target) => normalized.endsWith(" " + String(target).toLowerCase()));
      });
    }

    function resourceLabel(value) {
      return value ? "available" : "spent";
    }

    function renderRulesResults(results) {
      if (!results.length) {
        rulesResults.innerHTML = "<p class=\"muted\">No matching rules found.</p>";
        return;
      }
      rulesResults.innerHTML = results.map((result) => {
        const excerpt = result.text.length > 360 ? result.text.slice(0, 357).trim() + "..." : result.text;
        return "<div class=\"item\"><strong>" + escapeHtml(result.section)
          + "</strong><p class=\"score\">Score " + escapeHtml(String(result.score))
          + " | " + escapeHtml(result.title) + "</p><p>"
          + escapeHtml(excerpt) + "</p><p class=\"muted\">"
          + escapeHtml(result.url) + "</p><button type=\"button\" class=\"secondary\" data-use-rule=\""
          + escapeHtml(result.section) + "\">Use</button></div>";
      }).join("");
      document.querySelectorAll("[data-use-rule]").forEach((button) => {
        button.addEventListener("click", () => useRuleResult(button.dataset.useRule));
      });
    }

    function useRuleResult(section) {
      const action = state.lastRulesQuery || section || "";
      actionInput.value = action;
      actionInput.focus();
      setStatus("Loaded rule query into the action box.");
    }

    function ruleSourceSummary(rules) {
      return "Referenced: " + rules.map((rule) => rule.section).join(", ");
    }

    function dmSuggestionMetadata(metadata) {
      if (!metadata) return "";
      const action = metadata.action ? "Action: " + metadata.action + ". " : "";
      const rules = metadata.used_rules ? "Rules referenced: " + String(metadata.rules_count) + "." : "No rules referenced.";
      return action + rules;
    }

    function renderRecentEvents(events) {
      events.forEach((event) => {
        if (state.transcriptEventIds.has(event.id)) return;
        state.transcriptEventIds.add(event.id);
        appendTranscriptMessage(event.actor, event.content, eventMeta(event));
      });
    }

    function appendTranscript(text) {
      if (!text) return;
      text.split(/\n\n+/).forEach((block) => {
        const trimmed = block.trim();
        if (!trimmed) return;
        const parsed = trimmed.match(/^([^:\n]{1,32}):\s*([\s\S]*)$/);
        if (parsed) {
          appendTranscriptMessage(parsed[1], parsed[2]);
        } else {
          appendTranscriptMessage("Log", trimmed);
        }
      });
    }

    function appendTranscriptMessage(actor, content, meta) {
      if (!content) return;
      const message = document.createElement("article");
      message.className = "message " + actorClass(actor);
      const label = document.createElement("strong");
      label.textContent = actor;
      const body = document.createElement("div");
      body.textContent = content;
      message.appendChild(label);
      if (meta) {
        const metaLine = document.createElement("div");
        metaLine.className = "message-meta";
        metaLine.textContent = meta;
        message.appendChild(metaLine);
      }
      message.appendChild(body);
      transcript.appendChild(message);
      transcript.scrollTop = transcript.scrollHeight;
    }

    function eventMeta(event) {
      const parts = [];
      if (event.visibility) parts.push(event.visibility);
      if (event.created_at) parts.push(new Date(event.created_at).toLocaleString());
      return parts.join(" | ");
    }

    function actorClass(actor) {
      return String(actor || "log").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    }

    function setStatus(text, error) {
      statusBox.textContent = text;
      statusBox.classList.toggle("danger", Boolean(error));
    }

    function composeCampaignStatus() {
      const lines = ["Campaign " + state.campaignId + " loaded."];
      if (state.logStatus) lines.push(state.logStatus);
      return lines.join("\n");
    }

    function composeCocStatus() {
      const summary = state.cocSummary || {};
      const investigator = summary.investigator || {};
      return "COC scenario " + state.scenarioId + " loaded.\n"
        + "Investigator: " + (investigator.name || "unknown")
        + " | SAN " + String(investigator.current_sanity ?? "?")
        + " | " + (summary.completed ? "Completed" : "In progress")
        + " | Clues " + String(summary.discovered_clue_count ?? 0)
        + "/" + String(summary.clue_count ?? 0) + ".";
    }

    function composeLogStatus(data) {
      const returned = String(data.returned_count || 0);
      const filtered = String(data.filtered_count ?? data.event_count ?? 0);
      const total = String(data.event_count || 0);
      const scope = data.visibility ? " " + data.visibility : "";
      return "Loaded " + returned + "/" + filtered + scope + " log event(s), " + total + " total.";
    }

    function setControls(enabled) {
      const dndMode = state.mode === "dnd";
      sampleButton.disabled = !enabled || !dndMode;
      refreshButton.disabled = !enabled;
      clearTranscriptButton.disabled = !enabled;
      logVisibility.disabled = !enabled || !dndMode;
      actionInput.disabled = !enabled;
      sendButton.disabled = !enabled;
      dmButton.disabled = !enabled;
      updateSuggestedActionControl();
      document.querySelectorAll("[data-action]").forEach((button) => {
        button.disabled = !enabled;
      });
    }

    function updateSuggestedActionControl() {
      runSuggestedButton.disabled = !state.pendingSuggestedAction || (state.mode === "dnd" ? !state.campaignId : !state.scenarioId);
    }

    function renderQuickActions(actions) {
      const fallback = ["look", "inspect"];
      const preferred = actions.length ? actions : fallback;
      quickActions.innerHTML = preferred.map((action) => {
        return "<button type=\"button\" class=\"secondary\" data-action=\"" + escapeHtml(action) + "\">"
          + escapeHtml(actionLabel(action)) + "</button>";
      }).join("");
      bindQuickActions();
      setControls(Boolean(state.campaignId || state.scenarioId));
    }

    function bindQuickActions() {
      document.querySelectorAll("[data-action]").forEach((button) => {
        button.addEventListener("click", () => runAction(button.dataset.action));
      });
    }

    function actionLabel(action) {
      return action.replace(/\b\w/g, (letter) => letter.toUpperCase());
    }

    function featureLabel(enabled) {
      return enabled ? "enabled" : "disabled";
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (character) => {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          "\"": "&quot;",
          "'": "&#039;"
        }[character];
      });
    }

  </script>
</body>
</html>
